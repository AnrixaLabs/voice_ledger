name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or capability you would like to add.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and impact
      description: Note any expected API, data, device, deployment, privacy, or security impact.
